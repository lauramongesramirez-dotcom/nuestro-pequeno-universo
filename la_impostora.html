<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>La Impostora — Frutinovela</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#05050b;
  color:white;
  font-family:Georgia,serif;
  overflow:hidden;
}

#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,#30304f 0%,#11111f 45%,#050509 100%);
}

/* ESTRELLAS */

.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  animation:twinkle 2s infinite alternate;
  opacity:.7;
}

@keyframes twinkle{
  from{opacity:.15}
  to{opacity:1}
}

/* ESCENARIO */

.scene{
  position:absolute;
  inset:0;
}

.wall{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      #0d0d19 0%,
      #222039 18%,
      #302d49 50%,
      #222039 82%,
      #0d0d19 100%
    );
}

.floor{
  position:absolute;
  bottom:0;
  width:100%;
  height:30%;
  background:
    linear-gradient(#332b35,#15131c);
  transform:perspective(500px) rotateX(25deg);
  transform-origin:bottom;
}

/* VENTANA */

.window{
  position:absolute;
  width:42%;
  height:42%;
  left:29%;
  top:10%;
  border:12px solid #15131d;
  background:
    linear-gradient(#10182d,#263b61);
  box-shadow:
    0 0 50px #7b8dcc44;
}

.window:before{
  content:"";
  position:absolute;
  width:8px;
  height:100%;
  left:50%;
  background:#15131d;
}

.window:after{
  content:"";
  position:absolute;
  height:8px;
  width:100%;
  top:50%;
  background:#15131d;
}

.rain{
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      110deg,
      transparent 0 25px,
      #b9d9ff22 26px 28px,
      transparent 29px 50px
    );
  animation:rain 1s linear infinite;
}

@keyframes rain{
  from{transform:translateY(-30px)}
  to{transform:translateY(30px)}
}

/* PERSONAJES */

.character{
  position:absolute;
  bottom:15%;
  width:180px;
  height:440px;
  transition:
    left .8s ease,
    transform .6s ease,
    opacity .6s ease;
  transform-origin:bottom center;
}

.character.hidden{
  opacity:0;
  transform:translateY(100px) scale(.7);
}

.character.talking{
  animation:talking .35s infinite alternate;
}

@keyframes talking{
  from{transform:translateY(0)}
  to{transform:translateY(-7px)}
}

/* CUERPO */

.body{
  position:absolute;
  width:95px;
  height:185px;
  left:42px;
  bottom:0;
  border-radius:50px 50px 25px 25px;
  background:var(--body);
  border:2px solid #ffffff44;
  box-shadow:
    inset 10px 0 20px #ffffff22,
    inset -15px -10px 20px #0005;
}

/* CABEZA DE CRISTAL */

.gem{
  position:absolute;
  width:135px;
  height:155px;
  left:22px;
  top:15px;
  background:var(--gem);
  clip-path:
    polygon(
      50% 0,
      87% 22%,
      100% 65%,
      70% 100%,
      30% 100%,
      0 65%,
      13% 22%
    );
  filter:
    drop-shadow(0 0 18px var(--glow));
}

.gem:after{
  content:"";
  position:absolute;
  inset:8px;
  background:
    linear-gradient(
      130deg,
      #ffffffaa,
      transparent 25%,
      #0002 70%,
      #ffffff22
    );
  clip-path:inherit;
}

/* CARA */

.eye{
  position:absolute;
  top:78px;
  width:15px;
  height:20px;
  background:#11121c;
  border-radius:50%;
  z-index:4;
}

.eye.left{left:63px}
.eye.right{left:105px}

.eye:after{
  content:"";
  position:absolute;
  width:4px;
  height:5px;
  background:white;
  border-radius:50%;
  top:4px;
  left:4px;
}

.mouth{
  position:absolute;
  z-index:4;
  top:111px;
  left:83px;
  width:25px;
  height:9px;
  border-bottom:4px solid #11121c;
  border-radius:50%;
}

.talking .mouth{
  animation:mouth .2s infinite alternate;
}

@keyframes mouth{
  from{height:5px}
  to{height:18px}
}

/* BRAZOS */

.arm{
  position:absolute;
  bottom:105px;
  width:20px;
  height:120px;
  border-radius:20px;
  background:var(--body);
  border:2px solid #ffffff33;
  transform-origin:top center;
}

.arm.left{
  left:27px;
  transform:rotate(15deg);
}

.arm.right{
  right:25px;
  transform:rotate(-15deg);
}

.gesture .arm.right{
  animation:gesture .7s infinite alternate;
}

@keyframes gesture{
  from{transform:rotate(-15deg)}
  to{transform:rotate(-55deg)}
}

/* PIERNAS */

.leg{
  position:absolute;
  bottom:-35px;
  width:28px;
  height:70px;
  border-radius:20px;
  background:#242537;
}

.leg.left{left:58px}
.leg.right{left:96px}

/* COLORES */

.zafiro{
  --gem:#397cff;
  --body:#28458f;
  --glow:#528fff;
}

.rubi{
  --gem:#df3d58;
  --body:#782039;
  --glow:#ff4967;
}

.diamante{
  --gem:#ecfbff;
  --body:#b7d0df;
  --glow:#dfffff;
}

.onix{
  --gem:#303443;
  --body:#171a28;
  --glow:#747b94;
}

.cuarzo{
  --gem:#e9b7dc;
  --body:#a65d91;
  --glow:#f1bde5;
}

/* NOMBRES */

.name{
  position:absolute;
  bottom:-65px;
  width:100%;
  text-align:center;
  font-family:Arial,sans-serif;
  font-size:13px;
  font-weight:bold;
  letter-spacing:3px;
}

/* DIÁLOGO */

.dialogue{
  position:absolute;
  z-index:20;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  width:min(900px,92vw);
  min-height:150px;
  padding:20px 24px;
  border-radius:22px;
  background:#090913eF;
  border:1px solid #ffffff35;
  box-shadow:0 15px 50px #000b;
  backdrop-filter:blur(10px);
}

.speaker{
  color:#9dbbff;
  font-family:Arial,sans-serif;
  font-size:13px;
  font-weight:bold;
  letter-spacing:4px;
  margin-bottom:10px;
}

.text{
  font-size:20px;
  line-height:1.45;
  min-height:60px;
}

.next{
  position:absolute;
  right:18px;
  bottom:15px;
  border:none;
  background:#eeeaff;
  color:#111;
  padding:10px 20px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}

.next:hover{
  transform:scale(1.05);
}

/* CAPÍTULO */

.chapter{
  position:absolute;
  z-index:30;
  top:20px;
  left:20px;
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:3px;
  color:#d3ceff;
}

/* INTRO */

.intro{
  position:absolute;
  z-index:100;
  inset:0;
  background:
    radial-gradient(circle,#272540,#07070d 70%);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.intro h1{
  font-size:clamp(45px,10vw,90px);
  letter-spacing:12px;
  line-height:.9;
  margin:20px;
}

.intro p{
  color:#aaa;
  font-family:Arial,sans-serif;
  letter-spacing:2px;
}

.start{
  margin-top:25px;
  padding:15px 35px;
  border:0;
  border-radius:30px;
  background:#eeeaff;
  font-weight:bold;
  cursor:pointer;
}

/* TRANSICIÓN */

.transition{
  position:absolute;
  z-index:50;
  inset:0;
  background:#fff;
  pointer-events:none;
  opacity:0;
}

.transition.flash{
  animation:flash .45s;
}

@keyframes flash{
  0%{opacity:0}
  35%{opacity:.35}
  100%{opacity:0}
}

/* MÓVIL */

@media(max-width:600px){

  .character{
    width:130px;
    height:350px;
  }

  .gem{
    width:105px;
    height:120px;
    left:13px;
  }

  .body{
    width:70px;
    height:145px;
    left:30px;
  }

  .eye{
    top:61px;
    width:12px;
    height:16px;
  }

  .eye.left{left:47px}
  .eye.right{left:78px}

  .mouth{
    top:87px;
    left:63px;
  }

  .arm{
    height:90px;
    bottom:85px;
  }

  .arm.left{left:17px}
  .arm.right{right:16px}

  .leg{
    height:55px;
  }

  .leg.left{left:42px}
  .leg.right{left:72px}

  .text{
    font-size:16px;
  }

  .dialogue{
    bottom:12px;
    padding:15px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="stars"></div>

  <div class="intro" id="intro">

    <div>

      <div style="
        font-family:Arial;
        font-size:11px;
        letter-spacing:5px;
        color:#aaa;">
        UNA FRUTINOVELA
      </div>

      <h1>
        LA<br>
        IMPOSTORA
      </h1>

      <p>
        En una familia donde todos deben brillar,<br>
        alguien decidió desaparecer.
      </p>

      <button class="start" onclick="startEpisode()">
        ▶ COMENZAR
      </button>

    </div>

  </div>


  <div class="scene">

    <div class="wall"></div>
    <div class="floor"></div>

    <div class="window">
      <div class="rain"></div>
    </div>

    <div class="chapter" id="chapter">
      CAPÍTULO 1 · LA FUGA
    </div>


    <div id="zafiro" class="character zafiro hidden">
      <div class="gem"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>

      <div class="body"></div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="leg left"></div>
      <div class="leg right"></div>

      <div class="name">ZAFIRO</div>
    </div>


    <div id="rubi" class="character rubi hidden">
      <div class="gem"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>

      <div class="body"></div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="leg left"></div>
      <div class="leg right"></div>

      <div class="name">RUBÍ</div>
    </div>


    <div id="diamante" class="character diamante hidden">
      <div class="gem"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>

      <div class="body"></div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="leg left"></div>
      <div class="leg right"></div>

      <div class="name">DIAMANTE</div>
    </div>


    <div id="onix" class="character onix hidden">
      <div class="gem"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>

      <div class="body"></div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="leg left"></div>
      <div class="leg right"></div>

      <div class="name">ÓNIX</div>
    </div>


    <div id="cuarzo" class="character cuarzo hidden">
      <div class="gem"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>

      <div class="body"></div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="leg left"></div>
      <div class="leg right"></div>

      <div class="name">CUARZO</div>
    </div>


    <div class="dialogue">

      <div class="speaker" id="speaker">
        DIAMANTE
      </div>

      <div class="text" id="dialogueText">
      </div>

      <button class="next" onclick="nextScene()">
        SIGUIENTE →
      </button>

    </div>

  </div>

  <div id="transition" class="transition"></div>

</div>


<script>

/* =========================================
   ESTRELLAS
========================================= */

for(let i=0;i<70;i++){

  const star=document.createElement("div");

  star.className="star";

  star.style.left=Math.random()*100+"%";
  star.style.top=Math.random()*70+"%";

  star.style.animationDelay=Math.random()*2+"s";

  document.getElementById("stars").appendChild(star);
}


/* =========================================
   HISTORIA
========================================= */

const scenes=[

{
 character:"diamante",
 name:"DIAMANTE",
 text:"No puedo seguir viviendo así... Si me quedo, voy a desaparecer poco a poco.",
 emotion:"gesture"
},

{
 character:"diamante",
 name:"DIAMANTE",
 text:"Si descubren lo que encontré, no me van a dejar ir.",
 emotion:"gesture"
},

{
 character:"zafiro",
 name:"ZAFIRO",
 text:"¿Diamante? ... ¿Dónde está?",
 emotion:"normal"
},

{
 character:"zafiro",
 name:"ZAFIRO",
 text:"Todos dicen que se fue. Entonces... ¿por qué siento que alguien quería que desapareciera?",
 emotion:"gesture"
}

];


/* =========================================
   POSICIONES
========================================= */

const positions={

  zafiro:"30%",
  rubi:"45%",
  diamante:"45%",
  onix:"60%",
  cuarzo:"55%"

};


/* =========================================
   VOZ
========================================= */

function speak(text){

  if(!("speechSynthesis" in window))
    return;

  speechSynthesis.cancel();

  const voice=new SpeechSynthesisUtterance(text);

  voice.lang="es-ES";

  voice.rate=.88;

  voice.pitch=1.05;

  speechSynthesis.speak(voice);
}


/* =========================================
   ESCENA
========================================= */

let sceneIndex=-1;


function hideCharacters(){

  document
    .querySelectorAll(".character")
    .forEach(c=>{

      c.classList.add("hidden");
      c.classList.remove("talking");
      c.classList.remove("gesture");

    });

}


function showCharacter(id){

  const character=document.getElementById(id);

  character.classList.remove("hidden");

  character.style.left=positions[id];

}


function nextScene(){

  sceneIndex++;

  if(sceneIndex>=scenes.length){

    sceneIndex=0;

  }

  const scene=scenes[sceneIndex];

  hideCharacters();

  showCharacter(scene.character);

  const character=document.getElementById(scene.character);

  character.classList.add("talking");

  if(scene.emotion==="gesture"){

    character.classList.add("gesture");

  }

  document.getElementById("speaker").textContent=
    scene.name;

  document.getElementById("dialogueText").textContent=
    scene.text;

  document.getElementById("chapter").textContent=
    "CAPÍTULO 1 · LA FUGA";

  const flash=document.getElementById("transition");

  flash.classList.remove("flash");

  void flash.offsetWidth;

  flash.classList.add("flash");

  speak(scene.text);

}


/* =========================================
   COMENZAR
========================================= */

function startEpisode(){

  document.getElementById("intro").style.display="none";

  nextScene();

}


/* =========================================
   TECLA / PANTALLA
========================================= */

document.addEventListener("keydown",e=>{

  if(
    e.key==="Enter" ||
    e.key===" " ||
    e.key==="ArrowRight"
  ){

    nextScene();

  }

});

</script>

</body>
    </html>
