<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Impostora</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#05050c;
    color:white;
    font-family:Georgia,serif;
    overflow-x:hidden;
}

/* =========================
   FONDO
========================= */

#app{
    min-height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 20%, #252647 0%, #101024 35%, #05050c 75%);
}

.stars{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15}
    to{opacity:1}
}

/* =========================
   CABECERA
========================= */

.header{
    position:relative;
    z-index:5;
    text-align:center;
    padding:25px 15px 8px;
}

.header h1{
    margin:0;
    font-size:clamp(28px,7vw,55px);
    letter-spacing:8px;
    font-weight:normal;
}

.header p{
    margin:8px 0 0;
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:4px;
    color:#aaaac0;
}

/* =========================
   ESCENA
========================= */

.scene{
    width:min(1100px,94%);
    height:540px;
    margin:10px auto;
    position:relative;
    border:1px solid #292942;
    border-radius:28px;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 35%, #202142, #090912 72%);
    box-shadow:
        0 20px 80px #000b,
        inset 0 0 60px #0008;
}

/* Luna */

.moon{
    position:absolute;
    width:100px;
    height:100px;
    right:8%;
    top:8%;
    border-radius:50%;
    background:#e8edff;
    box-shadow:0 0 40px #b8c9ff;
}

/* =========================
   ESCENARIO / CASA
========================= */

.room{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:230px;
    background:
        linear-gradient(#16162a,#090911);
    border-top:1px solid #2d2d49;
}

.window{
    position:absolute;
    left:8%;
    bottom:70px;
    width:150px;
    height:150px;
    border:6px solid #24243c;
    background:
        linear-gradient(135deg,#101c43,#17285c);
    box-shadow:0 0 25px #263c8055;
}

.window:before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:3px;
    background:#292945;
}

.window:after{
    content:"";
    position:absolute;
    top:50%;
    left:0;
    right:0;
    height:3px;
    background:#292945;
}

/* =========================
   PERSONAJE
========================= */

.character{
    position:absolute;
    bottom:55px;
    left:50%;
    width:190px;
    height:370px;
    transform:translateX(-50%);
    transition:
        left .9s ease,
        opacity .6s ease,
        transform .6s ease;
    z-index:3;
}

.character.walk{
    animation:walking .65s infinite alternate;
}

@keyframes walking{
    from{transform:translateX(-50%) translateY(0)}
    to{transform:translateX(-50%) translateY(-7px)}
}

.character.hidden{
    opacity:0;
    pointer-events:none;
}

.character.talking{
    animation:talk .45s infinite alternate;
}

@keyframes talk{
    from{transform:translateX(-50%) scale(1)}
    to{transform:translateX(-50%) scale(1.015)}
}

/* Aura */

.aura{
    position:absolute;
    width:190px;
    height:300px;
    top:20px;
    border-radius:50%;
    filter:blur(35px);
    opacity:.35;
    animation:aura 3s infinite alternate;
}

@keyframes aura{
    from{opacity:.18;transform:scale(.9)}
    to{opacity:.5;transform:scale(1.08)}
}

/* Cabeza */

.head{
    position:absolute;
    width:105px;
    height:125px;
    left:42px;
    top:0;
    clip-path:polygon(
        50% 0,
        90% 25%,
        80% 80%,
        50% 100%,
        20% 80%,
        10% 25%
    );
    box-shadow:0 0 35px currentColor;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    50%{transform:translateY(-6px)}
}

/* Brillo */

.head:after{
    content:"";
    position:absolute;
    width:20px;
    height:75px;
    left:25px;
    top:18px;
    background:#ffffff45;
    transform:rotate(15deg);
}

/* Ojos */

.eye{
    position:absolute;
    width:18px;
    height:9px;
    border-bottom:4px solid white;
    border-radius:50%;
    top:58px;
    z-index:4;
}

.eye.left{left:22px}
.eye.right{right:22px}

.character.blink .eye{
    height:2px;
}

/* Boca */

.mouth{
    position:absolute;
    width:23px;
    height:10px;
    left:41px;
    top:84px;
    border-bottom:3px solid white;
    border-radius:50%;
    z-index:4;
}

/* Cuerpo */

.body{
    position:absolute;
    top:112px;
    left:47px;
    width:96px;
    height:145px;
    clip-path:polygon(
        25% 0,
        75% 0,
        100% 100%,
        0 100%
    );
}

/* Brazos */

.arm{
    position:absolute;
    width:15px;
    height:100px;
    top:125px;
    border-radius:20px;
    transition:.3s;
}

.arm.left{
    left:27px;
    transform:rotate(15deg);
}

.arm.right{
    right:27px;
    transform:rotate(-15deg);
}

.character.gesture .arm.left{
    transform:rotate(-35deg);
}

.character.gesture .arm.right{
    transform:rotate(35deg);
}

/* Piernas */

.leg{
    position:absolute;
    width:16px;
    height:90px;
    top:245px;
    border-radius:20px;
}

.leg.left{left:67px}
.leg.right{right:67px}

/* =========================
   COLORES
========================= */

.zafiro .aura{background:#198cff}
.zafiro .head{background:linear-gradient(135deg,#73d8ff,#146bd0,#061e59);color:#49bfff}
.zafiro .body{background:linear-gradient(90deg,#092d69,#248be0,#092d69)}
.zafiro .arm,
.zafiro .leg{background:#1672c9}

.rubi .aura{background:#ff173d}
.rubi .head{background:linear-gradient(135deg,#ff6575,#bd1537,#4e0719);color:#ff405b}
.rubi .body{background:linear-gradient(90deg,#711126,#e3264d,#711126)}
.rubi .arm,
.rubi .leg{background:#c91d42}

.diamante .aura{background:#d9ecff}
.diamante .head{background:linear-gradient(135deg,#fff,#dce9ff,#8fa6c5);color:white}
.diamante .body{background:linear-gradient(90deg,#9daec5,#eef6ff,#9daec5)}
.diamante .arm,
.diamante .leg{background:#c6d7ea}

.onix .aura{background:#725cff}
.onix .head{background:linear-gradient(135deg,#49475a,#12121b,#030306);color:#796aff}
.onix .body{background:linear-gradient(90deg,#11101b,#383346,#11101b)}
.onix .arm,
.onix .leg{background:#272331}

.cuarzo .aura{background:#ff7fc7}
.cuarzo .head{background:linear-gradient(135deg,#ffd8ee,#ee94c6,#934d85);color:#ff9bd4}
.cuarzo .body{background:linear-gradient(90deg,#91466f,#e28abb,#91466f)}
.cuarzo .arm,
.cuarzo .leg{background:#c26a9e}

/* =========================
   NOMBRE
========================= */

.characterName{
    position:absolute;
    top:390px;
    width:100%;
    text-align:center;
    font-size:14px;
    letter-spacing:4px;
}

/* =========================
   DIÁLOGO
========================= */

.dialogueBox{
    width:min(900px,92%);
    margin:15px auto 25px;
    padding:22px 25px;
    background:#101020ee;
    border:1px solid #30304a;
    border-radius:20px;
    position:relative;
    z-index:10;
    box-shadow:0 10px 40px #0008;
}

.chapter{
    text-align:center;
    color:#7778a0;
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:3px;
    margin-bottom:10px;
}

.speaker{
    color:#63caff;
    font-size:13px;
    letter-spacing:4px;
    font-weight:bold;
    margin-bottom:8px;
}

.dialogue{
    font-family:Arial,sans-serif;
    font-size:15px;
    line-height:1.65;
    min-height:80px;
}

button{
    margin-top:15px;
    padding:11px 25px;
    border-radius:25px;
    border:1px solid #4e8ed0;
    background:#17294b;
    color:white;
    cursor:pointer;
    font-weight:bold;
    transition:.25s;
}

button:hover{
    background:#244579;
    transform:scale(1.03);
}

/* =========================
   FINAL
========================= */

.final{
    text-align:center;
    padding:50px 20px;
}

.final h2{
    letter-spacing:7px;
    font-weight:normal;
}

.final p{
    color:#aaa;
    font-family:Arial,sans-serif;
}

/* Móvil */

@media(max-width:650px){

    .scene{
        height:470px;
    }

    .character{
        transform:translateX(-50%) scale(.82);
        transform-origin:bottom center;
    }

    .dialogueBox{
        margin-top:8px;
    }

    .dialogue{
        font-size:14px;
    }

    .moon{
        width:70px;
        height:70px;
    }
}
</style>
</head>

for(let i=0;i<70;i++){

/* ==========================================

const story = [

{
chapter:"CAPÍTULO 1 · LA FUGA",

text:`En mi familia siempre fue así...

{

/* CAPÍTULO 2 */

{

{

{

{
chapter:"CAPÍTULO 2 · LA SOSPECHA",

{
chapter:"CAPÍTULO 2 · LA SOSPECHA",

character:"rubi",

00:17.`

{

<br><br>
Pero yo no quiero ser una corona.

{

speaker:"CUARZO",
character:"cuarzo",
text:`Yo la vi llorar.

},

/* CAPÍTULO 4 */

{
chapter:"CAPÍTULO 4 · EL SECRETO DE RUBÍ",
speaker:"RUBÍ",
character:"rubi",

{

speaker:"RUBÍ",

chapter:"CAPÍTULO 11 · LA ELECCIÓN",

character:"cuarzo",

/* ==========================================
   VARIABLES
========================================== */

let current = 0;

const character = document.getElementById("character");
const chapter = document.getElementById("chapter");
const speaker = document.getElementById("speaker");
const dialogue = document.getElementById("dialogue");
const charName = document.getElementById("charName");
const button = document.getElementById("next");


/* ==========================================
   MOSTRAR ESCENA
========================================== */

function showScene(){

    const scene = story[current];

    chapter.textContent = scene.chapter;
    speaker.textContent = scene.speaker;
    dialogue.innerHTML = scene.text;

    character.className =
        "character " + scene.character;

    if(scene.gesture){
        character.classList.add("gesture");
    }

    character.classList.add("talking");

    charName.textContent = scene.speaker;

    /* Pequeño movimiento según personaje */

    const positions = {
        zafiro:"50%",
        rubi:"37%",
        diamante:"50%",
        onix:"63%",
        cuarzo:"50%"
    };

    character.style.left =
        positions[scene.character] || "50%";

    /* Parpadeo */

    setTimeout(()=>{
        character.classList.add("blink");

        setTimeout(()=>{
            character.classList.remove("blink");
        },180);

    },700);

    if(current === story.length-1){

        button.textContent="VOLVER AL INICIO";

    }else{

        button.textContent="SIGUIENTE →";

    }
}


/* ==========================================
   SIGUIENTE
========================================== */

function nextScene(){

    current++;

    if(current >= story.length){
        current = 0;
    }

    showScene();
}


/* ==========================================
   INICIAR
========================================== */

showScene();

</script>
