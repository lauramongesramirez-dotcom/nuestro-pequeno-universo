<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Impostora</title>
<style>
body{margin:0;background:#070710;color:white;font-family:sans-serif}
.top{background:#5a0a1a;text-align:center;padding:18px;letter-spacing:4px;font-weight:700;font-family:serif}
.hero{width:100%;max-height:420px;object-fit:contain;background:white}
.cap{text-align:center;margin:15px}
.cap span{background:#1e1e30;padding:6px 18px;border-radius:20px;font-size:12px}
.char-zone{position:relative;height:220px;display:flex;justify-content:center;align-items:end;gap:10px}
.char{width:90px;height:180px;object-fit:cover;border-radius:20px;transition:0.5s;filter:grayscale(0.8) brightness(0.6);transform:scale(0.9)}
.char.active{filter:none;transform:scale(1.15);box-shadow:0 0 20px currentColor}
h1{text-align:center;letter-spacing:6px;font-family:serif;margin:10px}
.card{border:1px solid #222;margin:15px;padding:20px;border-radius:18px;background:#10101f}
.card b{color:#6ea8ff;letter-spacing:3px;display:block;text-align:center;margin-bottom:10px}
.btn{position:fixed;bottom:15px;right:15px;background:#3a3a55;color:white;border:none;padding:14px 28px;border-radius:30px;font-weight:700}
</style>
</head>
<body>
<div class="top">TEMPORADA 1 - LA IMPOSTORA</div>
<img class="hero" src="personajes.png">
<div class="cap"><span id="capTxt">CAP 1/16</span></div>
<div class="char-zone">
<img id="z" class="char active" src="personajes.png" style="object-position:10% 0; clip-path:inset(0 80% 0 0)">
<img id="r" class="char" src="personajes.png" style="object-position:30% 0; clip-path:inset(0 60% 0 20%)">
<img id="d" class="char" src="personajes.png" style="object-position:50% 0; clip-path:inset(0 40% 0 40%)">
<img id="o" class="char" src="personajes.png" style="object-position:75% 0; clip-path:inset(0 20% 0 60%)">
<img id="c" class="char" src="personajes.png" style="object-position:95% 0; clip-path:inset(0 0 0 80%)">
</div>
<h1 id="titulo">LA FUGA</h1>
<div class="card"><b id="quien">ZAFIRO</b><p id="texto">En mi familia si no brillas no vales. Mi hermana Diamante era la que más brillaba. Anoche dijo "Ya no puedo más". A la mañana su caja estaba vacía. Todos creen que está enferma. Mentira. Ella huyó.</p></div>
<button class="btn" onclick="next()">SIGUIENTE →</button>
<script>
const caps=[
{t:"LA FUGA",q:"ZAFIRO",c:"z",txt:"En mi familia si no brillas no vales. Mi hermana Diamante era la que más brillaba. Anoche dijo 'Ya no puedo más'. A la mañana su caja estaba vacía. Todos creen que está enferma. Mentira. Ella huyó."},
{t:"LA SOSPECHA",q:"RUBI",c:"r",txt:"¿Y si no se fue? ¿Y si la obligaron? Zafiro siempre ve dramas donde no hay. Pero esta vez... la caja de Diamante olía a miedo."},
{t:"LA REINA",q:"DIAMANTE",c:"d",txt:"No huyo por cobarde. Huyo porque si me quedo, me apago para siempre. No quiero ser corona. Quiero ser persona."},
{t:"LA SOMBRA",q:"ONIX",c:"o",txt:"Que se vaya. Las que brillan mucho se queman rápido. Yo prefiero estar en la oscuridad, ahí nadie te pide brillar."},
{t:"EL CORAZON",q:"CUARZO",c:"c",txt:"Yo la vi llorar... Diamante no es de hielo. Solo se hizo una armadura. Yo quiero abrazarla, no pulirla."}
];
let i=0;
function next(){
i=(i+1)%caps.length;
document.getElementById('capTxt').innerText=`CAP ${i+1}/16`;
document.getElementById('titulo').innerText=caps[i].t;
document.getElementById('quien').innerText=caps[i].q;
document.getElementById('texto').innerText=caps[i].txt;
document.querySelectorAll('.char').forEach(x=>x.classList.remove('active'));
document.getElementById(caps[i].c).classList.add('active');
}
</script>
</body>
  </html>
