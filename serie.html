<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa de Piedras - Animada</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
body{margin:0;background:#1a0a2e;font-family:'Fredoka',sans-serif;overflow:hidden;color:white}
#stage{width:100vw;height:100vh;position:relative;background:radial-gradient(circle at 50% 20%, #4a2a7a, #1a0a2e);display:flex;flex-direction:column;align-items:center;justify-content:end}
.scene-bg{position:absolute;top:0;left:0;width:100%;height:70%;display:flex;align-items:end;justify-content:center;font-size:15vw;opacity:0.3}
.char{position:absolute;bottom:140px;font-size:70px;transition:all 0.8s ease;filter:drop-shadow(0 10px 20px rgba(0,0,0,0.5))}
.char.left{left:-100px} .char.right{right:-100px}
.char.active.left{left:20%} .char.active.right{right:20%}
.char.bounce{animation:bounce 0.6s infinite alternate}
.char.shine{animation:shine 1s infinite}
@keyframes bounce{to{transform:translateY(-15px) scale(1.1)}}
@keyframes shine{0%,100%{filter:brightness(1) drop-shadow(0 0 10px gold)}50%{filter:brightness(1.5) drop-shadow(0 0 30px gold)}}
.bubble{position:absolute;bottom:250px;background:white;color:#2a144a;padding:18px 24px;border-radius:25px 25px 25px 5px;max-width:60%;font-weight:600;font-size:18px;opacity:0;transform:scale(0.8);transition:0.4s;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble.right{right:15%;border-radius:25px 25px 5px 25px;background:#ffe066}
#controls{position:absolute;bottom:20px;width:90%;display:flex;justify-content:space-between;align-items:center;z-index:10}
button{background:#ff4ecd;border:none;padding:12px 22px;border-radius:50px;color:white;font-weight:700;font-family:'Fredoka';cursor:pointer;box-shadow:0 5px 15px rgba(255,78,205,0.4)}
#title{position:absolute;top:20px;font-size:28px;font-weight:700;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,0.5)}
#ep{position:absolute;top:60px;background:rgba(255,255,255,0.2);padding:5px 15px;border-radius:20px;font-size:14px}
.gem{position:absolute;font-size:40px;animation:float 3s infinite ease-in-out}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(10deg)}}
</style>
</head>
<body>
<div id="stage">
<div id="title">✨ CASA DE PIEDRAS ✨</div>
<div id="ep">Capítulo 1 / 16</div>
<div class="scene-bg" id="bg">🏠</div>
<div class="char left" id="c1">💎</div>
<div class="char right" id="c2">🌙</div>
<div class="bubble" id="bubble"></div>
<div id="controls">
<button onclick="prev()">⬅️</button>
<button onclick="play()" id="playBtn">▶️ PLAY</button>
<button onclick="next()">➡️</button>
</div>
</div>
